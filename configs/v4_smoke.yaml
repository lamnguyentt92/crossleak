# SMOKE TEST of the v0.4 study (tiny sizes; not frozen; its numbers mean nothing). Causal-defence study v0.4 (CrossLeak). Frozen by prereg/V4_FREEZE.sha256 with prereg/V4_PREREG.md.
# Reuses the frozen main driver (src/crossleak/experiments/main.py, hash unchanged) through experiments/v4.py, which adds,
# on the same cold-start targets, public context (d1p) and DP-Prototype public centres (d4p, LifeSnaps) restricted to
# data from before the forecast origin, next to the original configurations. Utility cells only.
experiment: v4_smoke
driver: v4
seed: 20261116          # fresh: no sample repeats E0 (20261112), v0.2 (20261114) or v0.3 (20261115)
pool_seed: 20261112     # same user pools as E0 / v0.2
horizon: 24
context_length: 336
probe_short_len: 24
bootstrap: 50
delta: 1.0e-5
part_budget_sec: 25
cost_per_series:
  c2small: 0.03
  c2base: 0.15

models:
  c2small: autogluon/chronos-2-small
  c2base: amazon/chronos-2

pools: {victim: 0.5, aux: 0.35, public: 0.15}

datasets:
  eld:
    train_days: ["2013-01-15", "2013-12-20"]
    test_days: ["2014-01-15", "2014-12-20"]
    exclude_days: ["2013-03-31", "2013-04-01", "2013-10-27", "2013-10-28", "2014-03-30", "2014-03-31", "2014-10-26", "2014-10-27"]
    target_frac: 0.3
  lifesnaps:
    train_days: null
    test_days: null
    exclude_days: []
    target_frac: 0.5

d4:
  representation: dayfold
  P: [8]
  P_primary: 8
  eps: [1, 4]
  sum_share: 0.9
  centre_days: 40

d1:
  min_gap_days: 56

# Utility, one day of history, both models, 600 targets per dataset x model (as v0.3).
utility:
  - {dataset: eld, models: [c2base, c2small], ell: 24, n_targets: 6, xl_k: [4, 16], d1_k: [16], d4: true}
  - {dataset: lifesnaps, models: [c2base, c2small], ell: 24, n_targets: 6, xl_k: [4, 8], d1_k: [4], d4: true}
xl_ref: {eld: 16, lifesnaps: 8}

# Confirmatory rules (prereg/V4_PREREG.md): TOST on the paired gain difference, base model, 90 % CI within +/- margin.
equivalence:
  margin: 0.02
  model: c2base
  pairs:
    - {dataset: eld, ell: 24, a: d1p_16, b: xl16}
    - {dataset: eld, ell: 24, a: d4_P8_eps1, b: xl16}
    - {dataset: eld, ell: 24, a: d4_P8_eps1, b: d1p_16}
    - {dataset: lifesnaps, ell: 24, a: d1p_4, b: xl8}
    - {dataset: lifesnaps, ell: 24, a: d4p_P8_eps1, b: xl8}
  no_benefit: []

# Estimands: effect of causality, paired on the same targets (same 90 % interval, no verdict).
effects:
  - {dataset: eld, ell: 24, a: d1p_16, b: d1_16}
  - {dataset: lifesnaps, ell: 24, a: d1p_4, b: d1_4}
  - {dataset: lifesnaps, ell: 24, a: d4p_P8_eps1, b: d4_P8_eps1}

# The frozen main builder reads these sections; v4 runs utility cells only (experiments/v4.py drops the rest).
attack: {sizes: {2: [10, 10]}, families: []}
channel: {n_pairs: {2: 10}, families: []}
invariance: {k: 4, n: 1, models: [], datasets: []}
dpaudit: {n_train: 10, n_test: 10}
cost: {models: [], xl_k: [4], d4_P: [8], batch_users: 4, repeats: 1, threads: 4}
agcheck: {run_on_cluster: false}
