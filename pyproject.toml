[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crossleak"
version = "0.4.0"
description = "Co-tenant privacy leakage of in-context cross-learning in time-series foundation models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lam Nguyen" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=14",
  "pyyaml>=6",
  "torch>=2.2",
  "chronos-forecasting==2.3.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
crossleak = "crossleak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights and data (set CROSSLEAK_SLOW=1)"]
